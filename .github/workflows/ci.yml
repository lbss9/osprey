name: ci

# Fast checks on every push and pull request: frontend types, bundle, Rust
# unit tests, and the driver integration suite against real servers.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: osprey
          POSTGRES_DB: demo
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: osprey
          MYSQL_DATABASE: demo
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -posprey --silent" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Osprey!2026pass"
          MSSQL_PID: Developer
        ports: ["51433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Osprey!2026pass' -Q 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: osprey
          CLICKHOUSE_DB: demo
        ports: ["58123:8123"]
        options: >-
          --health-cmd "clickhouse-client --password osprey --query 'SELECT 1'" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: UI tests (Playwright on the mocked backend)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Driver integration tests
        env:
          OSPREY_TEST_PG: postgres://postgres:osprey@127.0.0.1:55432/demo
          OSPREY_TEST_MYSQL: mysql://root:osprey@127.0.0.1:53306/demo
          OSPREY_TEST_REDIS: redis://127.0.0.1:56379/0
          OSPREY_TEST_CLICKHOUSE: http://default:osprey@127.0.0.1:58123/demo
          OSPREY_TEST_MSSQL: mssql://sa:Osprey!2026pass@127.0.0.1:51433/master
        run: cargo test --manifest-path src-tauri/Cargo.toml --test drivers -- --ignored --test-threads=1
