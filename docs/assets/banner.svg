<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a22"/>
      <stop offset="1" stop-color="#0b1015"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd0f5"/>
      <stop offset="1" stop-color="#2aa7d8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc766"/>
      <stop offset="1" stop-color="#f0a030"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37b7e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#37b7e6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="600" height="300" rx="24" fill="url(#glow)"/>
  <!-- faint grid lines on the right -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="760" y1="70" x2="1150" y2="70"/>
    <line x1="760" y1="110" x2="1150" y2="110"/>
    <line x1="760" y1="150" x2="1150" y2="150"/>
    <line x1="760" y1="190" x2="1150" y2="190"/>
    <line x1="760" y1="230" x2="1150" y2="230"/>
  </g>
  <!-- data rows -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="780" y="80" width="200" height="16" rx="8"/>
    <rect x="1000" y="80" width="120" height="16" rx="8"/>
    <rect x="780" y="120" width="140" height="16" rx="8"/>
    <rect x="940" y="120" width="180" height="16" rx="8"/>
    <rect x="780" y="200" width="230" height="16" rx="8"/>
    <rect x="1030" y="200" width="90" height="16" rx="8"/>
  </g>
  <!-- the caught row -->
  <rect x="770" y="153" width="360" height="34" rx="17" fill="url(#amber)"/>
  <rect x="790" y="164" width="110" height="12" rx="6" fill="#0d151d" fill-opacity="0.55"/>
  <rect x="915" y="164" width="190" height="12" rx="6" fill="#0d151d" fill-opacity="0.35"/>
  <!-- mark -->
  <rect x="56" y="70" width="160" height="160" rx="40" fill="#0d151d" stroke="#1f2b37"/>
  <path d="M136 98 C 126 118, 104 130, 70 128 C 90 140, 114 146, 126 143 L 136 166 L 146 143 C 158 146, 182 140, 202 128 C 168 130, 146 118, 136 98 Z" fill="url(#sky)"/>
  <circle cx="136" cy="124" r="8" fill="#0d151d"/>
  <circle cx="136" cy="124" r="3.5" fill="url(#amber)"/>
  <rect x="86" y="182" width="100" height="10" rx="5" fill="url(#amber)"/>
  <rect x="86" y="200" width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>
  <!-- text -->
  <text x="252" y="128" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#e8eef3" letter-spacing="-1">Osprey</text>
  <text x="256" y="168" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#a9b6c2">A fast, beautiful database client</text>
  <text x="256" y="200" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" fill="#6f7d8a">PostgreSQL · MySQL · Redis — local-first, no account, no telemetry</text>
  <!-- chips -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="256" y="222" width="76" height="26" rx="13" fill="#14303d"/><text x="294" y="239" text-anchor="middle" fill="#6fd0f5">Tauri 2</text>
    <rect x="340" y="222" width="62" height="26" rx="13" fill="#14303d"/><text x="371" y="239" text-anchor="middle" fill="#6fd0f5">Rust</text>
    <rect x="410" y="222" width="80" height="26" rx="13" fill="#14303d"/><text x="450" y="239" text-anchor="middle" fill="#6fd0f5">React 19</text>
    <rect x="498" y="222" width="120" height="26" rx="13" fill="#3a2d12"/><text x="558" y="239" text-anchor="middle" fill="#ffc766">Win · mac · Linux</text>
  </g>
</svg>
